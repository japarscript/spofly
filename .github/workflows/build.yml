name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: oven-sh/setup-bun@v2
      - name: Frontend check & build
        run: |
          cd frontend
          bun install
          bun run check
          bun run build
      - name: Go unit tests
        run: go test -v ./...

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: oven-sh/setup-bun@v2
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Install frontend deps
        run: cd frontend && bun install
      - name: Build macOS Universal app
        run: $(go env GOPATH)/bin/wails build -platform darwin/universal
      - name: Package macOS zip
        run: ditto -c -k --sequesterRsrc --keepParent "build/bin/Spofly.app" "Spofly-macOS-universal.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Spofly-macOS
          path: Spofly-macOS-universal.zip

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: oven-sh/setup-bun@v2
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Install frontend deps
        run: cd frontend && bun install
      - name: Build Windows amd64 executable
        run: |
          $gopath = go env GOPATH
          & "$gopath\bin\wails.exe" build -platform windows/amd64
          Copy-Item "build\bin\Spofly.exe" "Spofly-Windows-amd64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: Spofly-Windows
          path: Spofly-Windows-amd64.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/Spofly-macOS-universal.zip
            release-assets/Spofly-Windows-amd64.exe
