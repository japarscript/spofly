name: Build & Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: oven-sh/setup-bun@v2
      - name: Frontend check & build
        run: |
          cd frontend
          bun install
          bun run check
          bun run build
      - name: Go unit tests
        run: go test -v ./...

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: oven-sh/setup-bun@v2
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Install frontend deps
        run: cd frontend && bun install
      - name: Build macOS Universal app
        run: $(go env GOPATH)/bin/wails build -platform darwin/universal
      - uses: actions/upload-artifact@v4
        with:
          name: Spofly-macOS
          path: build/bin/Spofly.app

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: oven-sh/setup-bun@v2
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Install frontend deps
        run: cd frontend && bun install
      - name: Build Windows amd64 executable
        run: |
          $gopath = go env GOPATH
          & "$gopath\bin\wails.exe" build -platform windows/amd64
      - uses: actions/upload-artifact@v4
        with:
          name: Spofly-Windows
          path: build/bin/Spofly.exe

